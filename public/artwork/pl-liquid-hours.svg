<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Liquid Hours playlist cover">
  <defs>
    <radialGradient id="a" cx="28%" cy="22%" r="90%">
      <stop offset="0" stop-color="#dce9e2"/>
      <stop offset="0.42" stop-color="#7fa8a6"/>
      <stop offset="1" stop-color="#0d1c22"/>
    </radialGradient>
    <linearGradient id="b" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0a1418" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#9fc9c0" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="46"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#a)"/>
  <rect width="800" height="800" fill="url(#b)" opacity="0.75"/>
  <g filter="url(#blur)" opacity="0.7">
    <ellipse cx="620" cy="180" rx="190" ry="150" fill="#eaf4ee" opacity="0.6"/>
    <ellipse cx="180" cy="640" rx="220" ry="170" fill="#2c5a60" opacity="0.8"/>
  </g>
  <g fill="none" stroke="#f2f7f3" stroke-opacity="0.34">
    <circle cx="420" cy="380" r="188" stroke-width="1.1"/>
    <circle cx="420" cy="380" r="248" stroke-width="0.7" stroke-opacity="0.18"/>
    <ellipse cx="420" cy="380" rx="300" ry="120" stroke-width="0.8" stroke-opacity="0.22" transform="rotate(-18 420 380)"/>
  </g>
  <circle cx="420" cy="380" r="188" fill="#dff0e6" fill-opacity="0.06"/>
  <rect width="800" height="800" filter="url(#grain)" opacity="0.09" style="mix-blend-mode:overlay"/>
</svg>
