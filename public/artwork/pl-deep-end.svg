<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="The Deep End playlist cover">
  <defs>
    <radialGradient id="a" cx="50%" cy="12%" r="100%">
      <stop offset="0" stop-color="#9fe0c4"/>
      <stop offset="0.4" stop-color="#2f7a63"/>
      <stop offset="1" stop-color="#03130f"/>
    </radialGradient>
    <linearGradient id="b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9f5e0" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#03110d" stop-opacity="0.94"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="54"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#a)"/>
  <rect width="800" height="800" fill="url(#b)"/>
  <g filter="url(#blur)" opacity="0.75">
    <ellipse cx="400" cy="120" rx="190" ry="150" fill="#c9f5e0" opacity="0.5"/>
    <ellipse cx="400" cy="680" rx="280" ry="200" fill="#052a22" opacity="0.9"/>
  </g>
  <g fill="none" stroke="#d7f7e8" stroke-opacity="0.3">
    <path d="M60 520 C 220 430, 360 610, 520 500 S 740 430, 790 470" stroke-width="1.3"/>
    <path d="M40 590 C 210 490, 370 680, 540 560 S 750 490, 810 530" stroke-width="0.8" stroke-opacity="0.18"/>
    <path d="M120 450 C 270 370, 390 530, 540 430 S 720 370, 770 400" stroke-width="0.7" stroke-opacity="0.14"/>
  </g>
  <g fill="#eafff6">
    <circle cx="300" cy="505" r="2.4" opacity="0.8"/>
    <circle cx="336" cy="524" r="1.6" opacity="0.6"/>
    <circle cx="515" cy="500" r="2" opacity="0.7"/>
    <circle cx="552" cy="528" r="1.4" opacity="0.5"/>
  </g>
  <rect width="800" height="800" filter="url(#grain)" opacity="0.1" style="mix-blend-mode:overlay"/>
</svg>
