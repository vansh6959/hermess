<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Neon Commute playlist cover">
  <defs>
    <radialGradient id="a" cx="72%" cy="18%" r="95%">
      <stop offset="0" stop-color="#e7ff9b"/>
      <stop offset="0.38" stop-color="#8fbf3c"/>
      <stop offset="1" stop-color="#0a1408"/>
    </radialGradient>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1208" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#b6e04a" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="52"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#a)"/>
  <rect width="800" height="800" fill="url(#b)" opacity="0.7"/>
  <g filter="url(#blur)" opacity="0.75">
    <ellipse cx="200" cy="230" rx="210" ry="160" fill="#d9f76d" opacity="0.55"/>
    <ellipse cx="640" cy="600" rx="230" ry="180" fill="#1c3a12" opacity="0.9"/>
  </g>
  <g fill="none">
    <path d="M90 620 C 250 380, 420 520, 540 300 S 760 180, 790 240" stroke="#eaffb0" stroke-opacity="0.5" stroke-width="1.4"/>
    <path d="M60 680 C 240 430, 430 570, 560 350 S 780 230, 810 290" stroke="#eaffb0" stroke-opacity="0.22" stroke-width="1"/>
    <circle cx="540" cy="300" r="6" fill="#f2ffc2" fill-opacity="0.9"/>
    <circle cx="540" cy="300" r="26" stroke="#f2ffc2" stroke-opacity="0.25"/>
  </g>
  <rect width="800" height="800" filter="url(#grain)" opacity="0.1" style="mix-blend-mode:overlay"/>
</svg>
