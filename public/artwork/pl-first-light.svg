<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="First Light playlist cover">
  <defs>
    <radialGradient id="a" cx="24%" cy="18%" r="100%">
      <stop offset="0" stop-color="#fdf3e6"/>
      <stop offset="0.45" stop-color="#f2c9a8"/>
      <stop offset="1" stop-color="#3a2a26"/>
    </radialGradient>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6ea" stop-opacity="0.3"/>
      <stop offset="0.55" stop-color="#8a6252" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#241a18" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#a)"/>
  <rect width="800" height="800" fill="url(#b)"/>
  <g filter="url(#blur)" opacity="0.75">
    <ellipse cx="180" cy="200" rx="200" ry="170" fill="#fffaf0" opacity="0.6"/>
    <ellipse cx="620" cy="640" rx="230" ry="190" fill="#6a4a3e" opacity="0.7"/>
  </g>
  <g fill="none" stroke="#fff4e4" stroke-opacity="0.4">
    <circle cx="520" cy="290" r="96" stroke-width="0.9"/>
    <circle cx="520" cy="290" r="96" fill="#fff6e8" fill-opacity="0.12" stroke="none"/>
    <path d="M90 610 C 260 540, 420 600, 700 470" stroke-width="0.9" stroke-opacity="0.22"/>
    <path d="M90 650 C 270 580, 430 640, 710 510" stroke-width="0.6" stroke-opacity="0.14"/>
  </g>
  <rect width="800" height="800" filter="url(#grain)" opacity="0.08" style="mix-blend-mode:overlay"/>
</svg>
