<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Float playlist cover">
  <defs>
    <radialGradient id="a" cx="60%" cy="30%" r="95%">
      <stop offset="0" stop-color="#e9e6f7"/>
      <stop offset="0.42" stop-color="#a9b4e4"/>
      <stop offset="1" stop-color="#141a2c"/>
    </radialGradient>
    <linearGradient id="b" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#101728" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#c8cef0" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="64"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#a)"/>
  <rect width="800" height="800" fill="url(#b)" opacity="0.8"/>
  <g filter="url(#blur)" opacity="0.7">
    <ellipse cx="620" cy="640" rx="230" ry="180" fill="#cdd5f5" opacity="0.45"/>
    <ellipse cx="200" cy="200" rx="200" ry="160" fill="#7d8cc8" opacity="0.6"/>
  </g>
  <g fill="none" stroke="#eef0ff" stroke-opacity="0.35">
    <ellipse cx="400" cy="390" rx="260" ry="90" stroke-width="0.9" transform="rotate(24 400 390)"/>
    <ellipse cx="400" cy="390" rx="260" ry="90" stroke-width="0.9" transform="rotate(-32 400 390)"/>
    <circle cx="400" cy="390" r="120" stroke-width="0.8" stroke-opacity="0.2"/>
  </g>
  <circle cx="400" cy="390" r="90" fill="#ffffff" fill-opacity="0.08"/>
  <circle cx="400" cy="390" r="90" stroke="#ffffff" stroke-opacity="0.2" stroke-width="0.8"/>
  <rect width="800" height="800" filter="url(#grain)" opacity="0.08" style="mix-blend-mode:overlay"/>
</svg>
